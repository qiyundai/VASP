[workspace]
members = ["crates/core", "crates/platform", "crates/app", "crates/broker"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
hex = "=0.4.3"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
thiserror = "=2.0.17"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "=2.5.7"
semver = "=1.0.27"
ed25519-dalek = "=2.2.0"
base64 = "=0.22.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Credentials", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Services", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_EventLog", "Win32_System_Rpc", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Networking_WinSock", "Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
overflow-checks = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
