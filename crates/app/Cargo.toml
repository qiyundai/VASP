[package]
name = "vasp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vasp-core = { path = "../core" }
vasp-platform = { path = "../platform" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
rusqlite.workspace = true
reqwest.workspace = true
url.workspace = true
base64.workspace = true
clap = { version = "=4.5.50", features = ["derive"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wgpu"] }
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "dx12", "wgsl"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "=0.14.10"
time = { version = "=0.3.55", features = ["formatting"] }
tray-icon = "=0.21.2"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "=3.23.0"

[lints]
workspace = true

[[bin]]
name = "vasp"
path = "src/main.rs"

[[bin]]
name = "vasp-desktop"
path = "src/desktop.rs"
