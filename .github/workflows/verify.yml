name: Verify Windows build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Cache Rust dependencies and build outputs
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: windows-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
        id: release
      - name: Save compiled outputs before service fault injection
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Check parser isolation
        run: |
          target/release/vasp.exe --data data/ci init
          target/release/vasp.exe --data data/ci sandbox-check
      - name: Package broker preview
        run: ./scripts/Package-Preview.ps1 -SkipBuild
      - name: Test privileged service on disposable runner
        run: ./scripts/Test-BrokerService.ps1 -DisposableEnvironment
      - name: Test native WFP and watchdog recovery on disposable runner
        run: ./scripts/Test-WfpRecovery.ps1 -DisposableEnvironment
